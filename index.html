<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Dog Controller Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #4CAF50;
        }

        .status {
            margin: 10px 0;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #333;
            display: inline-block;
        }

        .status.connected {
            background-color: #2E7D32;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .panel-title {
            font-size: 1.2rem;
            color: #4CAF50;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            text-align: center;
        }

        /* Directional Control Pad */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 240px;
            height: 240px;
            margin: 0 auto 20px auto;
        }

        .control-btn {
            background-color: #333;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .control-btn:hover:not(:disabled) { background-color: #444; }
        .control-btn:active:not(:disabled) { background-color: #4CAF50; }
        .control-btn:disabled {
            background-color: #1a1a1a;
            color: #444;
            cursor: not-allowed;
        }

        #forward { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #stop { grid-column: 2; grid-row: 2; background-color: #F44336; }
        #stop:active:not(:disabled) { background-color: #D32F2F; }
        #right { grid-column: 3; grid-row: 2; }
        #backward { grid-column: 2; grid-row: 3; }

        /* Mode & Action Buttons */
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover:not(:disabled) { background-color: #1976D2; }
        .action-btn.active {
            background-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }
        .action-btn:disabled {
            background-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }

        /* Tuning Sliders */
        .slider-control {
            margin-bottom: 18px;
        }

        .slider-control label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #bbb;
        }

        .slider-control span {
            color: #4CAF50;
            font-weight: bold;
        }

        .slider-input {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            outline: none;
            border-radius: 5px;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
        }
        
        .slider-input:disabled::-webkit-slider-thumb {
            background: #555;
        }

        .connection-section {
            margin-top: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #connect-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #connect-btn:hover { background-color: #2E7D32; }
        #connect-btn.connected { background-color: #F44336; }
        #connect-btn.connected:hover { background-color: #D32F2F; }
    </style>
</head>
<body>
    <header>
        <h1>Robot Dog Controller</h1>
        <div id="status" class="status">Disconnected</div>
    </header>

    <div class="main-container">
        <div class="panel">
            <div class="panel-title">Motion Control</div>
            <div class="controls">
                <button id="forward" class="control-btn" disabled>↑</button>
                <button id="left" class="control-btn" disabled>←</button>
                <button id="stop" class="control-btn" disabled>■</button>
                <button id="right" class="control-btn" disabled>→</button>
                <button id="backward" class="control-btn" disabled>↓</button>
            </div>

            <div class="btn-group">
                <button id="stand" class="action-btn" disabled>Stand</button>
                <button id="sit" class="action-btn" disabled>Sit / Rest</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Gait & Adjustments</div>
            
            <label style="display:block; margin-bottom:8px; font-size:0.95rem; color:#bbb;">Movement Mode:</label>
            <div class="btn-group" style="margin-bottom: 25px;">
                <button id="mode-trot" class="action-btn active" disabled>Trot</button>
                <button id="mode-creep" class="action-btn" disabled>Creep</button>
                <button id="mode-pose" class="action-btn" disabled>Static Pose</button>
            </div>

            <div class="slider-control">
                <label for="speed">Gait Speed: <span id="speed-value">0.3</span></label>
                <input type="range" id="speed" class="slider-input" min="0.1" max="1.0" step="0.1" value="0.3" disabled>
            </div>

            <div class="slider-control">
                <label for="height">Body Height: <span id="height-value">50</span></label>
                <input type="range" id="height" class="slider-input" min="20" max="100" step="5" value="50" disabled>
            </div>

            <div class="slider-control">
                <label for="stride">Stride Length: <span id="stride-value">30</span></label>
                <input type="range" id="stride" class="slider-input" min="10" max="60" step="5" value="30" disabled>
            </div>

            <div class="slider-control">
                <label for="trim">Balance Trim Offset: <span id="trim-value">0</span></label>
                <input type="range" id="trim" class="slider-input" min="-20" max="20" step="2" value="0" disabled>
            </div>
        </div>
    </div>

    <div class="connection-section">
        <button id="connect-btn">Connect to Robot</button>
    </div>

    <script>
        // BLE Configuration
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        // DOM Elements
        const statusElement = document.getElementById('status');
        const connectButton = document.getElementById('connect-btn');
        const allSliders = document.querySelectorAll('.slider-input');
        const allButtons = document.querySelectorAll('button:not(#connect-btn)');

        // BLE Variables
        let bleDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let isConnected = false;

        function updateUI() {
            if (isConnected) {
                statusElement.textContent = 'Connected';
                statusElement.classList.add('connected');
                connectButton.textContent = 'Disconnect';
                connectButton.classList.add('connected');
                allButtons.forEach(btn => btn.disabled = false);
                allSliders.forEach(sld => sld.disabled = false);
            } else {
                statusElement.textContent = 'Disconnected';
                statusElement.classList.remove('connected');
                connectButton.textContent = 'Connect to Robot';
                connectButton.classList.remove('connected');
                allButtons.forEach(btn => btn.disabled = true);
                allSliders.forEach(sld => sld.disabled = true);
            }
        }

        async function connectToDevice() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'RobotDog' }],
                    optionalServices: [UART_SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                const characteristics = await service.getCharacteristics();

                for (const char of characteristics) {
                    if (char.uuid === UART_RX_CHARACTERISTIC_UUID) rxCharacteristic = char;
                    if (char.uuid === UART_TX_CHARACTERISTIC_UUID && char.properties.notify) {
                        txCharacteristic = char;
                        await txCharacteristic.startNotifications();
                        txCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
                            const decoded = new TextDecoder().decode(e.target.value);
                            console.log('From Robot:', decoded);
                        });
                    }
                }
                isConnected = true;
                updateUI();
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    isConnected = false;
                    updateUI();
                });
            } catch (error) {
                console.error(error);
                alert('Connection Error: ' + error.message);
            }
        }

        function sendCommand(command) {
            if (!isConnected || !rxCharacteristic) return;
            try {
                const data = new TextEncoder().encode(command + '\n');
                rxCharacteristic.writeValue(data);
                console.log('Sent:', command);
            } catch (error) {
                console.error('Send failed:', error);
            }
        }

        connectButton.addEventListener('click', () => {
            if (isConnected) { bleDevice.gatt.disconnect(); isConnected = false; updateUI(); }
            else { connectToDevice(); }
        });

        // Directional Commands
        document.getElementById('forward').addEventListener('click', () => sendCommand('move forward'));
        document.getElementById('backward').addEventListener('click', () => sendCommand('move back'));
        document.getElementById('left').addEventListener('click', () => sendCommand('move left'));
        document.getElementById('right').addEventListener('click', () => sendCommand('move right'));
        document.getElementById('stop').addEventListener('click', () => sendCommand('move stop'));

        // Basic States
        document.getElementById('stand').addEventListener('click', () => sendCommand('state stand'));
        document.getElementById('sit').addEventListener('click', () => sendCommand('state sit'));

        // Gait Mode Switching
        const gaitModes = ['mode-trot', 'mode-creep', 'mode-pose'];
        gaitModes.forEach(id => {
            document.getElementById(id).addEventListener('click', (e) => {
                gaitModes.forEach(m => document.getElementById(m).classList.remove('active'));
                e.target.classList.add('active');
                sendCommand(`gait ${id.replace('mode-', '')}`);
            });
        });

        // Real-time Adjustment Sliders
        const setupSlider = (id, commandKey) => {
            const slider = document.getElementById(id);
            const valDisplay = document.getElementById(`${id}-value`);
            slider.addEventListener('input', () => {
                valDisplay.textContent = slider.value;
                sendCommand(`adj ${commandKey} ${slider.value}`);
            });
        };

        setupSlider('speed', 'speed');
        setupSlider('height', 'height');
        setupSlider('stride', 'stride');
        setupSlider('trim', 'trim');

        // Keyboard Fallback Mapping
        document.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            if (e.key === 'ArrowUp') sendCommand('move forward');
            if (e.key === 'ArrowDown') sendCommand('move back');
            if (e.key === 'ArrowLeft') sendCommand('move left');
            if (e.key === 'ArrowRight') sendCommand('move right');
            if (e.key === ' ') sendCommand('move stop');
        });

        updateUI();
    </script>
</body>
</html>
